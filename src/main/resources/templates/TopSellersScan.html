<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바코드 스캔 - 탑셀러 출고</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .scan-area { display: flex; flex-direction: column; gap: 15px; }
        input[type="text"] { width: 100%; padding: 15px 20px; font-size: 18px; border: 2px solid #e0e0e0; border-radius: 10px; outline: none; transition: all 0.3s; }
        input[type="text"]:focus { border-color: #667eea; box-shadow: 0 0 0 4px rgba(102,126,234,0.1); }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: white; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        button:active { transform: translateY(0); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .btn-complete { background: linear-gradient(135deg, #28a745 0%, #218838 100%); margin-top: 15px; }
        .btn-complete:hover { box-shadow: 0 10px 20px rgba(40,167,69,0.3); }
        .btn-imweb { background: linear-gradient(135deg, #17a2b8 0%, #117a8b 100%); margin-top: 10px; }
        .btn-imweb:hover { box-shadow: 0 10px 20px rgba(23,162,184,0.3); }
        .btn-close-today { background: linear-gradient(135deg, #dc3545 0%, #a71d2a 100%); margin-top: 10px; }
        .btn-close-today:hover { box-shadow: 0 10px 20px rgba(220,53,69,0.3); }
        .imweb-row { display: flex; gap: 10px; margin-top: 15px; align-items: stretch; }
        .imweb-row input[type="date"] { flex: 0 0 180px; padding: 15px; font-size: 16px; border: 2px solid #ddd; border-radius: 10px; }
        .imweb-row button { flex: 1; margin: 0; }
        .result { margin-top: 30px; padding: 20px; border-radius: 10px; display: none; }
        .result.success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .result.error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .result.waiting { background: #fff3cd; border: 1px solid #ffc107; color: #856404; }
        .result-title { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .loader { display: none; text-align: center; margin-top: 20px; }
        .loader.active { display: block; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>바코드 스캔</h1>
        <p class="subtitle">바코드를 스캔하거나 주문번호를 입력하세요</p>

        <div class="scan-area">
            <input type="text" id="barcodeInput" placeholder="바코드 스캔 또는 주문번호 입력" autocomplete="off" autofocus />
            <button id="submitBtn">처리</button>
            <button id="completeBtn" class="btn-complete">완료 (미출력 주문 다운로드)</button>
            <button id="closeTodayBtn" class="btn-close-today">금일마감 (완료된 합포장 순번 초기화)</button>
            <div class="imweb-row">
                <input type="date" id="imwebDate" />
                <button id="imwebDownloadBtn" class="btn-imweb">아임웹 송장양식 다운로드</button>
            </div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const barcodeInput = document.getElementById('barcodeInput');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');

        barcodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitBtn.click();
            }
        });

        submitBtn.addEventListener('click', async () => {
            const barcodeValue = barcodeInput.value.trim();
            if (!barcodeValue) {
                alert('바코드 값을 입력해주세요.');
                barcodeInput.focus();
                return;
            }

            try {
                submitBtn.disabled = true;
                loader.classList.add('active');
                result.style.display = 'none';

                const response = await fetch('/api/v1/topsellers/scan/' + encodeURIComponent(barcodeValue), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (data.success && data.data && data.data.labelImagePath) {
                    // 송장 발급 완료 - 라벨 출력
                    showResult('success', '운송장 생성 완료 - 운송장번호: ' + data.data.invoiceNo);
                    if (data.data.bundleSeq && data.data.bundleTotal && data.data.bundleTotal > 1) {
                        alert(data.data.bundleSeq + '번째 합포장의 주문건이 출력됩니다. (총 ' + data.data.bundleTotal + '건)');
                    }
                    var printUrl = '/topsellers/label-print-view?path=' + encodeURIComponent(data.data.labelImagePath);
                    window.open(printUrl, '_blank', 'width=800,height=600');
                } else if (data.success && data.data && data.data.bundleComplete === false) {
                    // 합포장 대기 상태
                    showResult('waiting', data.message);
                } else if (!data.success) {
                    showResult('error', data.message || '처리에 실패했습니다.');
                } else {
                    showResult('success', data.message);
                }
            } catch (error) {
                alert('오류가 발생했습니다: ' + error.message);
                showResult('error', '오류가 발생했습니다: ' + error.message);
            } finally {
                loader.classList.remove('active');
                submitBtn.disabled = false;
                barcodeInput.value = '';
                barcodeInput.focus();
            }
        });

        // 아임웹 송장양식 다운로드 - 기본값: 오늘 날짜
        (function initImwebDate() {
            const d = new Date();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            document.getElementById('imwebDate').value = yyyy + '-' + mm + '-' + dd;
        })();

        document.getElementById('imwebDownloadBtn').addEventListener('click', async () => {
            const dateValue = document.getElementById('imwebDate').value;
            if (!dateValue) {
                alert('날짜를 선택해주세요.');
                return;
            }

            try {
                const response = await fetch('/api/v1/topsellers/imweb-invoice-download?date=' + encodeURIComponent(dateValue));
                if (!response.ok) throw new Error('서버 오류');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const disposition = response.headers.get('Content-Disposition') || '';
                const match = disposition.match(/filename\*=UTF-8''([^;]+)/) || disposition.match(/filename="?([^";]+)"?/);
                a.download = match ? decodeURIComponent(match[1]) : ('아임웹송장일괄등록_' + dateValue.replace(/-/g, '') + '.xlsx');
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

                showResult('success', '아임웹 송장양식 다운로드 완료 (' + dateValue + ')');
            } catch (error) {
                showResult('error', '다운로드 중 오류: ' + error.message);
            }
        });

        document.getElementById('completeBtn').addEventListener('click', async () => {
            if (!confirm('오늘 스캔을 완료하시겠습니까?\n미출력 주문 엑셀 파일이 다운로드됩니다.')) return;

            try {
                const response = await fetch('/api/v1/topsellers/complete', { method: 'POST' });
                if (!response.ok) throw new Error('서버 오류');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = response.headers.get('Content-Disposition')?.split('filename=')[1]?.replace(/"/g, '') || 'feedback.xlsx';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

                showResult('success', '미출력 주문 엑셀 다운로드 완료');
            } catch (error) {
                showResult('error', '완료 처리 중 오류: ' + error.message);
            }
        });

        document.getElementById('closeTodayBtn').addEventListener('click', async () => {
            if (!confirm('금일 발급 완료된 합포장 순번을 초기화합니다.\n(진행중/대기중 합포장은 유지됩니다)\n계속하시겠습니까?')) return;

            try {
                const response = await fetch('/api/v1/topsellers/close-today', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    showResult('success', data.message);
                } else {
                    showResult('error', data.message || '금일마감 처리에 실패했습니다.');
                }
            } catch (error) {
                showResult('error', '금일마감 처리 중 오류: ' + error.message);
            }
        });

        function showResult(type, message) {
            result.className = 'result ' + type;
            var title = type === 'success' ? 'Success' : type === 'waiting' ? '합포장 대기' : 'Error';
            result.innerHTML = '<div class="result-title">' + title + '</div><div>' + message + '</div>';
            result.style.display = 'block';
        }
    </script>
</body>
</html>
