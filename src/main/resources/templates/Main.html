<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustEnter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 50px 40px; max-width: 500px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 32px; }
        .subtitle { text-align: center; color: #999; margin-bottom: 40px; font-size: 14px; }
        .menu { display: flex; flex-direction: column; gap: 16px; }
        .menu a {
            display: flex; align-items: center; gap: 16px;
            padding: 20px 24px; border-radius: 12px; text-decoration: none;
            color: white; font-size: 18px; font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu a:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .menu a:active { transform: translateY(0); }
        .menu a .icon { font-size: 28px; width: 40px; text-align: center; }
        .menu a .label { flex: 1; }
        .menu a .arrow { font-size: 20px; opacity: 0.7; }
        .upload { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .scan { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .swagger { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    </style>
</head>
<body>
    <div class="container">
        <h1>JustEnter</h1>
        <p class="subtitle">탑셀러 출고 관리 시스템</p>
        <div class="menu">
            <a href="/topsellers/upload" class="upload">
                <span class="icon">📄</span>
                <span class="label">엑셀 업로드</span>
                <span class="arrow">›</span>
            </a>
            <a href="/topsellers/scan" class="scan">
                <span class="icon">📦</span>
                <span class="label">바코드 스캔</span>
                <span class="arrow">›</span>
            </a>
            <a href="/swagger-ui.html" class="swagger">
                <span class="icon">📘</span>
                <span class="label">Swagger API</span>
                <span class="arrow">›</span>
            </a>
        </div>
    </div>
</body>
</html>
