<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑셀 업로드 - 탑셀러 출고 주문</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .upload-area { border: 2px dashed #ccc; border-radius: 10px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
        .upload-area:hover, .upload-area.dragover { border-color: #667eea; background: rgba(102,126,234,0.05); }
        .upload-area p { color: #666; font-size: 16px; margin-top: 10px; }
        .upload-area .icon { font-size: 48px; }
        .file-name { color: #333; font-weight: bold; margin-top: 10px; display: none; }
        input[type="file"] { display: none; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; color: white; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        button:active { transform: translateY(0); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .result { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; }
        .result.success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .result.error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .result-title { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .loader { display: none; text-align: center; margin-top: 20px; }
        .loader.active { display: block; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Excel Upload</h1>
        <p class="subtitle">탑셀러 출고 주문 엑셀 파일(.xlsx)을 업로드하세요</p>

        <div class="upload-area" id="dropZone">
            <div class="icon">📄</div>
            <p>클릭하거나 파일을 드래그하세요</p>
            <div class="file-name" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept=".xlsx,.xls" />

        <button id="uploadBtn" disabled>업로드</button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const fileNameEl = document.getElementById('fileName');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) selectFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files[0]) selectFile(fileInput.files[0]); });

        function selectFile(file) {
            const name = file.name.toLowerCase();
            if (!name.endsWith('.xlsx') && !name.endsWith('.xls')) {
                showResult('error', '엑셀 파일(.xlsx, .xls)만 업로드 가능합니다.');
                return;
            }
            selectedFile = file;
            fileNameEl.textContent = file.name;
            fileNameEl.style.display = 'block';
            uploadBtn.disabled = false;
            result.style.display = 'none';
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            const formData = new FormData();
            formData.append('file', selectedFile);
            try {
                uploadBtn.disabled = true;
                loader.classList.add('active');
                result.style.display = 'none';
                const response = await fetch('/api/v1/topsellers/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success && data.data) {
                    var d = data.data;
                    var msg = '엑셀 데이터 건 수: ' + d.totalCount + '건';
                    msg += '<br>엑셀 업로드 완료건 수: ' + d.savedCount + '건';
                    msg += '<br>이미 등록되어 있는 건 수: ' + d.skippedCount + '건';
                    if (d.validationErrors && d.validationErrors.length > 0) {
                        msg += '<br><br><b>필수항목 누락</b>';
                        for (var i = 0; i < d.validationErrors.length; i++) {
                            msg += '<br>- ' + d.validationErrors[i];
                        }
                    }
                    if (d.todayBundleGroups > 0 || d.remainingBundleGroups > 0) {
                        msg += '<br><br><b>합포장 현황</b>';
                        msg += '<br>- 금일 업로드: 합포장 ' + d.todayBundleGroups + '건 (' + d.todayBundleItems + '개 주문)';
                        if (d.remainingBundleGroups > 0) {
                            msg += '<br>- 기존 잔여: 합포장 ' + d.remainingBundleGroups + '건 (' + d.remainingBundleItems + '개 주문)';
                        }
                    }
                    showResult('success', msg);
                } else {
                    showResult(data.success ? 'success' : 'error', data.message);
                }
            } catch (error) {
                showResult('error', '업로드 중 오류가 발생했습니다: ' + error.message);
            } finally {
                loader.classList.remove('active');
                uploadBtn.disabled = false;
            }
        });

        function showResult(type, message) {
            result.className = 'result ' + type;
            result.innerHTML = '<div class="result-title">' + (type === 'success' ? 'Success' : 'Error') + '</div><div>' + message + '</div>';
            result.style.display = 'block';
        }
    </script>
</body>
</html>
